services:
  jablotron-api:
    build: .
    image: jablotron-api-server:latest
    restart: unless-stopped
    stop_grace_period: 20s
    environment:
      JABLOTRON_API_DB_PATH: /data/jablotron-api.db
      JABLOTRON_API_PORT: "8443"
      JABLOTRON_API_TLS_CERTFILE: /data/certs/server.crt
      JABLOTRON_API_TLS_KEYFILE: /data/certs/server.key
      JABLOTRON_API_TLS_CA_CERTS: /data/certs/ca.crt
      JABLOTRON_API_RUNTIME_MODE: "${JABLOTRON_API_RUNTIME_MODE:-live}"
      # Required in live mode (any non-empty value works for demo). Set
      # in a sibling .env file (gitignored); see .env.example.
      JABLOTRON_PANEL_AUTH_CODE: "${JABLOTRON_PANEL_AUTH_CODE:?must be set in .env}"
      JABLOTRON_PANEL_PORT: "${JABLOTRON_PANEL_PORT:-/dev/hidraw0}"
      JABLOTRON_PANEL_FLEXI_CFG_DEVICE: "${JABLOTRON_PANEL_FLEXI_CFG_DEVICE:-/dev/sdb1}"
      JABLOTRON_PANEL_FLEXI_LOG_DEVICE: "${JABLOTRON_PANEL_FLEXI_LOG_DEVICE:-/dev/sdc1}"
    volumes:
      - ./.dev-data:/data
      - ./.dev-certs:/data/certs:ro
    device_cgroup_rules:
      - "c 13:* rmw"
      - "b *:* rmw"
    devices:
      - /dev/hidraw0:/dev/hidraw0
      - /dev/sdb1:/dev/sdb1
      - /dev/sdc1:/dev/sdc1
    ports:
      - "8443:8443"
