[build-system]
requires = ["setuptools>=68", "wheel"]
build-backend = "setuptools.build_meta"

[project]
name = "jablotron-api-server"
version = "0.1.0"
description = "Jablotron API server and Home Assistant client integration"
readme = "README.md"
requires-python = ">=3.11"
license = { text = "MIT" }
authors = [
  { name = "OpenAI Codex" }
]
dependencies = [
  "fastapi>=0.115.0,<1",
  "uvicorn>=0.32.0,<1",
  "pydantic>=2.9.0,<3",
  "httpx>=0.27.0,<1",
  "websockets>=13.0,<16",
  "msgpack>=1.1.0,<2",
]

[project.optional-dependencies]
dev = [
  "pytest>=8.0.0",
]

[project.scripts]
jablotron-api-server = "jablotron_api.cli.main:main"
jablotron-api-client = "jablotron_api.cli.client:main"

[tool.setuptools]
package-dir = { "" = "src" }
py-modules = [
  "export_cfg_tool",
  "flexi_pcap_tool",
  "import_cfg_tool",
  "jablotron_event_tool",
  "jablotron_re_tools",
  "jablotron_usb_debug",
  "jablotron_user_tool",
]

[tool.setuptools.packages.find]
where = ["src"]
